name: Maven verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: runtime_test
          POSTGRES_PASSWORD: runtime_test
          POSTGRES_DB: runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime_test -d runtime_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IIB_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/runtime_test
      IIB_TEST_POSTGRES_USER: runtime_test
      IIB_TEST_POSTGRES_PASSWORD: runtime_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify runtime with PostgreSQL
        run: mvn -B -f runtime/pom.xml verify

  runtime-lite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: runtime_test
          POSTGRES_PASSWORD: runtime_test
          POSTGRES_DB: runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime_test -d runtime_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      artemis:
        image: apache/artemis:2.53.0-alpine
        env:
          ARTEMIS_USER: lite_test
          ARTEMIS_PASSWORD: lite_test
        ports:
          - 61616:61616
    env:
      IIB_LITE_INT_POSTGRES_URL: jdbc:postgresql://localhost:5432/runtime_test
      IIB_LITE_INT_POSTGRES_USER: runtime_test
      IIB_LITE_INT_POSTGRES_PASSWORD: runtime_test
      IIB_LITE_INT_ARTEMIS_URL: tcp://localhost:61616
      IIB_LITE_INT_ARTEMIS_USER: lite_test
      IIB_LITE_INT_ARTEMIS_PASSWORD: lite_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify runtime-lite with PostgreSQL and Artemis
        run: mvn -B -f runtime-lite/pom.xml -Pint-test verify
      - name: Verify XSD generation tool
        run: mvn -B -f runtime-lite/xsd-tool/pom.xml verify

  converter-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify converter and compatibility tests
        run: mvn -B -f pom.xml -pl converter,compatibility-tests/legacy-runtime -am verify
