queues:
  - ORDERS.IN
  - ORDERS.OUT
  - ORDERS.ERROR.Q
cases:
  - name: unsupported-trace-restores-input-and-goes-to-error
    input:
      queue: ORDERS.IN
      message: messages/order-new.xml
    expect:
      queue: ORDERS.ERROR.Q
      absentProperties: [CommentField]
  - name: priority-retained-when-unsupported-trace-goes-to-error
    input:
      queue: ORDERS.IN
      message: messages/order-new.xml
      mqmd:
        priority: 6
    expect:
      queue: ORDERS.ERROR.Q
      absentProperties: [CommentField]
      mqmd:
        priority: 6
