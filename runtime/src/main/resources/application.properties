spring.application.name=iib-camel

# --- Camel: загрузка маршрутов, сгенерированных конвертером (FR-R2.1) ---
camel.main.routes-include-pattern = classpath:camel/*.xml

# --- Embedded Artemis для e2e (L3): брокер стартует вместе с приложением; ---
# в продуктиве заменяется внешним брокером (spring.artemis.host/port или spring.jms.*).
spring.artemis.mode=EMBEDDED

# QoS: приоритет и TTL исходящего сообщения наследуются от входного
# (аналог копирования MQMD в Compute; IIB → JMS).
camel.component.jms.preserve-message-qos=true
