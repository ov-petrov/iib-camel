spring.application.name=iib-camel
spring.profiles.default=local
camel.main.routes-include-pattern=classpath:camel/*.xml
camel.component.jms.preserve-message-qos=true
camel.springboot.tracing=true

# InOnly consume and send on this connection factory share one local JMS transaction.
iib.messaging.maximum-redeliveries=${IIB_JMS_MAXIMUM_REDELIVERIES:2}
iib.messaging.redelivery-delay=${IIB_JMS_REDELIVERY_DELAY:1000}
iib.messaging.dead-letter-queue=${IIB_JMS_DLQ:IIB.DLQ}
iib.messaging.concurrent-consumers=${IIB_JMS_CONSUMERS:1}
