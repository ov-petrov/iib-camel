spring.artemis.mode=native
spring.artemis.embedded.enabled=false
iib.mq.host=${IBM_MQ_HOST:}
iib.mq.port=${IBM_MQ_PORT:1414}
iib.mq.queue-manager=${IBM_MQ_QUEUE_MANAGER:}
iib.mq.channel=${IBM_MQ_CHANNEL:}
iib.mq.user=${IBM_MQ_USER:}
iib.mq.password=${IBM_MQ_PASSWORD:}
iib.mq.ssl-cipher-suite=${IBM_MQ_SSL_CIPHER_SUITE:}
iib.mq.ssl-peer-name=${IBM_MQ_SSL_PEER_NAME:}
iib.mq.max-connections=${IBM_MQ_MAX_CONNECTIONS:2}
iib.mq.max-sessions-per-connection=${IBM_MQ_MAX_SESSIONS:20}
iib.mq.pool-wait-timeout=${IBM_MQ_POOL_WAIT_TIMEOUT:5000}
