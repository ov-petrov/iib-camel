spring.artemis.mode=native
spring.artemis.embedded.enabled=false
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://127.0.0.1:61626}
spring.artemis.user=${ARTEMIS_USER:pilot}
spring.artemis.password=${ARTEMIS_PASSWORD}
spring.artemis.pool.enabled=true
spring.artemis.pool.max-connections=${ARTEMIS_MAX_CONNECTIONS:2}
spring.artemis.pool.max-sessions-per-connection=${ARTEMIS_MAX_SESSIONS:20}
spring.artemis.pool.block-if-full-timeout=${ARTEMIS_POOL_WAIT_TIMEOUT:5s}
