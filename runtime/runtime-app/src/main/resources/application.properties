spring.application.name=integration-runtime
server.port=${SERVER_PORT:8080}
camel.main.run-controller=true
camel.main.routes-include-pattern=false
camel.component.jms.enabled=false
camel.component.kafka.enabled=false
spring.datasource.url=${IIB_POSTGRES_URL:jdbc:postgresql://127.0.0.1:55432/iib_runtime}
spring.datasource.username=${IIB_POSTGRES_USER:runtime_dev}
spring.datasource.password=${IIB_POSTGRES_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${IIB_POSTGRES_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.flyway.locations=classpath:db/migration/runtime
iib.delivery.enabled=${IIB_DELIVERY_ENABLED:true}
iib.delivery.publisher-enabled=${IIB_DELIVERY_PUBLISHER_ENABLED:false}
iib.delivery.batch-size=${IIB_DELIVERY_BATCH_SIZE:20}
iib.delivery.max-attempts=${IIB_DELIVERY_MAX_ATTEMPTS:5}
iib.delivery.lease=${IIB_DELIVERY_LEASE:PT1M}
iib.delivery.backoff=${IIB_DELIVERY_BACKOFF:PT1S}
iib.delivery.scheduler.fixed-delay=${IIB_DELIVERY_FIXED_DELAY:PT1S}
iib.modules.example.enabled=${IIB_MODULE_EXAMPLE_ENABLED:false}
iib.modules.example.input-uri=${IIB_MODULE_EXAMPLE_INPUT_URI:direct:example-input}
iib.modules.example.source-id=${IIB_MODULE_EXAMPLE_SOURCE_ID:example-input}
iib.modules.example.output-transport=${IIB_MODULE_EXAMPLE_OUTPUT_TRANSPORT:artemis}
iib.modules.example.output-destination=${IIB_MODULE_EXAMPLE_OUTPUT_DESTINATION:EXAMPLE.OUT}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
