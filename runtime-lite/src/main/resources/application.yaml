spring:
  application:
    name: runtime-lite
  datasource:
    url: ${LITE_DB_URL:jdbc:postgresql://localhost:5432/runtime_lite}
    username: ${LITE_DB_USER:runtime_lite}
    password: ${LITE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      schema: ${spring.liquibase.default-schema}
  liquibase:
    default-schema: ${LITE_DB_SCHEMA:runtime_lite}
  kafka:
    bootstrap-servers: ${LITE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        '[enable.idempotence]': true
        '[max.block.ms]': 30000
        '[request.timeout.ms]': 30000
        '[delivery.timeout.ms]': 30000
        '[linger.ms]': 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash

runtime-lite:
  jms:
    provider: ${LITE_JMS_PROVIDER:IBM_MQ}
  mq:
    host: ${LITE_MQ_HOST:localhost}
    port: ${LITE_MQ_PORT:1414}
    queue-manager: ${LITE_MQ_QUEUE_MANAGER:QM1}
    channel: ${LITE_MQ_CHANNEL:DEV.APP.SVRCONN}
    username: ${LITE_MQ_USER:}
    password: ${LITE_MQ_PASSWORD:}
  artemis:
    broker-url: ${LITE_ARTEMIS_URL:tcp://localhost:61616}
    username: ${LITE_ARTEMIS_USER:}
    password: ${LITE_ARTEMIS_PASSWORD:}
  listeners:
    auto-startup: true
    max-body-bytes: 10485760
  outbox:
    batch-size: 20
    max-attempts: 10
    retry-delay: 10s
    poll-interval: PT1S
  routes: {}

---

spring:
  config:
    activate:
      on-profile: local | test

logging:
  structured:
    format:
      console: ''
